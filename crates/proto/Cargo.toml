[package]
name = "reallyme-openid4vci-proto"
version = "0.1.1"
description = "ReallyMe OpenID4VCI protobuf messages generated with Buffa."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reallyme-openid4vci-proto"
categories = ["authentication", "encoding"]
keywords = ["openid4vci", "protobuf", "identity", "reallyme"]
publish = true
include = [
    "/src/**/*.rs",
    "/proto/**/*.proto",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["generated"]
generated = [
    "dep:buffa",
    "buffa/json",
    "dep:serde",
    "dep:zeroize",
]
[dependencies]
buffa = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "generated_security_tests"
path = "tests/generated_security_tests.rs"
required-features = ["generated"]

[lints]
workspace = true
