  OPEN_ID4_VCI_ERROR_REASON_PROOF_REQUIRED = 8;
  OPEN_ID4_VCI_ERROR_REASON_INVALID_PROOFS = 9;
  OPEN_ID4_VCI_ERROR_REASON_INVALID_CREDENTIAL_RESPONSE = 10;
  OPEN_ID4_VCI_ERROR_REASON_INVALID_NOTIFICATION = 11;

  // Issuer endpoint and credential-production reasons.
