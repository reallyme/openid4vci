  OPEN_ID4_VCI_ERROR_REASON_UNSPECIFIED = 0;

  // Shared OpenID4VCI wire-validation reasons.
  OPEN_ID4_VCI_ERROR_REASON_MISSING_REQUIRED_FIELD = 1;
