syntax = "proto3";

package reallyme.openid4vci.v1;

option go_package = "github.com/reallyme/openid4vci/gen/go/reallyme/openid4vci/v1;openid4vciv1";
option java_multiple_files = true;
option java_outer_classname = "OpenId4VciProto";
option java_package = "me.really.openid4vci.v1";

// Every field whose name ends in `_json`, plus CredentialEnvelope.json and
// Proofs.di_vp_json, carries one complete UTF-8 JSON value. The proto-codec
// accepts at most 262144 bytes per value, rejects duplicate object keys and
// nesting deeper than 64 containers, and rejects trailing data. Producers emit
// compact Serde JSON; consumers must not rely on object-key ordering or lexical
// number formatting. Generated owners zeroize these byte buffers on clear and
// drop after the deterministic generated-code hardening step.

// OpenId4VciErrorReason is the component-specific reason-code enum carried by
// reallyme.identity.common.v1.IdentityStackError when domain is OPENID4VCI.
// Values are stable public boundary codes; internal errors must map into one of
// these before crossing RPC, SDK, FFI, storage, audit, or telemetry boundaries.
// After the first public release, removed values must reserve both their number
// and name; published values must never be renumbered or reused.
