// ProblemDetails is the canonical proto representation of an RFC 9457
// OpenID4VCI problem response. `reason` is the stable typed classification;
// `error`, `status`, and `title` are validated projections for HTTP/JSON
// compatibility rather than independent free-form error channels.
message ProblemDetails {
  string type_uri = 1 [json_name = "type"];
  string title = 2;
  uint32 status = 3;
  string instance = 4; // reallyme:sensitive
  string error = 5;
  OpenId4VciErrorReason reason = 6;
}

// CredentialFormat is the protobuf boundary equivalent of OpenID4VCI credential
// format identifiers.
enum CredentialFormat {
  CREDENTIAL_FORMAT_UNSPECIFIED = 0;
  CREDENTIAL_FORMAT_JWT_VC_JSON = 1;
  CREDENTIAL_FORMAT_DC_SD_JWT = 2;
  CREDENTIAL_FORMAT_MSO_MDOC = 3;
  CREDENTIAL_FORMAT_LDP_VC = 4;
  CREDENTIAL_FORMAT_JWT_VC_JSON_LD = 5;
}

// NotificationEvent is the final OpenID4VCI Notification Endpoint event enum.
enum NotificationEvent {
  NOTIFICATION_EVENT_UNSPECIFIED = 0;
  NOTIFICATION_EVENT_CREDENTIAL_ACCEPTED = 1;
  NOTIFICATION_EVENT_CREDENTIAL_FAILURE = 2;
  NOTIFICATION_EVENT_CREDENTIAL_DELETED = 3;
}

// TxCodeInputMode describes the expected transaction-code input mode.
enum TxCodeInputMode {
  TX_CODE_INPUT_MODE_UNSPECIFIED = 0;
  TX_CODE_INPUT_MODE_NUMERIC = 1;
  TX_CODE_INPUT_MODE_TEXT = 2;
}

// TxCode is the final tx_code object replacing draft user_pin fields.
message TxCode {
  TxCodeInputMode input_mode = 1;
  uint64 length = 2;
  string description = 3;
}

message AuthorizationCodeGrant {
  string issuer_state = 1; // reallyme:sensitive
  string authorization_server = 2;
}

message PreAuthorizedCodeGrant {
  string pre_authorized_code = 1; // reallyme:sensitive
  TxCode tx_code = 2;
  string authorization_server = 3;
}

message CredentialOfferGrants {
  AuthorizationCodeGrant authorization_code = 1;
  PreAuthorizedCodeGrant pre_authorized_code = 2;
}

// CredentialOffer is the proto-first representation of an OpenID4VCI Credential
// Offer document.
message CredentialOffer {
  string credential_issuer = 1;
  repeated string credential_configuration_ids = 2;
  CredentialOfferGrants grants = 3;
}

message CredentialOfferUri {
  oneof payload {
    CredentialOffer credential_offer = 1;
    string credential_offer_uri = 2; // reallyme:sensitive
  }
}

message CredentialSelector {
  oneof selector {
    string credential_configuration_id = 1;
    string credential_identifier = 2; // reallyme:sensitive
  }
}

// Proofs carries final-spec OpenID4VCI proof members. Exactly one repeated
// member family is populated in valid Credential Requests.
message Proofs {
  repeated string jwt = 1; // reallyme:sensitive
  repeated bytes di_vp_json = 2;
  repeated string attestation = 3; // reallyme:sensitive
}

// CredentialResponseEncryption carries wallet-provided JWE parameters. jwk_json
// is a UTF-8 JSON object encoded as bytes to avoid redefining JWK here.
message CredentialResponseEncryption {
  bytes jwk_json = 1;
  string enc = 2;
  string zip = 3;
}

message CredentialRequest {
  CredentialSelector selector = 1;
  Proofs proofs = 2;
  CredentialResponseEncryption credential_response_encryption = 3;
}

message CredentialEnvelope {
  oneof credential {
    string compact = 1; // reallyme:sensitive
    bytes json = 2;
    bytes binary = 3;
  }
}

message ImmediateCredentialResponse {
  repeated CredentialEnvelope credentials = 1;
  string notification_id = 2; // reallyme:sensitive
}

message DeferredCredentialResponse {
  string transaction_id = 1; // reallyme:sensitive
  uint64 interval = 2;
}

message CredentialResponse {
  oneof response {
    ImmediateCredentialResponse immediate = 1;
    DeferredCredentialResponse deferred = 2;
  }
}

message DeferredCredentialRequest {
  string transaction_id = 1; // reallyme:sensitive
  CredentialResponseEncryption credential_response_encryption = 2;
}

message NonceRequest {}

message NonceResponse {
  string c_nonce = 1; // reallyme:sensitive
}

message GetNonceRequest {}

message GetNonceResponse {
  NonceResponse nonce = 1;
}

message NotificationRequest {
  string notification_id = 1; // reallyme:sensitive
  NotificationEvent event = 2;
  string event_description = 3; // reallyme:sensitive
}

message NotifyRequest {
  NotificationRequest notification = 1;
}

message NotifyResponse {}

message IssueCredentialRequest {
  CredentialRequest credential_request = 1;
}

message IssueCredentialResponse {
  CredentialResponse credential_response = 1;
}

message CredentialRequestPreflight {
  CredentialSelector selector = 1;
  uint32 binding_key_count = 2;
  uint32 verified_proof_count = 3;
  bool includes_key_attestation = 4;
  bool response_encryption_requested = 5;
}

message PreflightCredentialRequest {
  CredentialRequest credential_request = 1;
}

message PreflightCredentialResponse {
  CredentialRequestPreflight preflight = 1;
}

message GetDeferredCredentialRequest {
  DeferredCredentialRequest deferred_credential_request = 1;
}

message GetDeferredCredentialResponse {
  CredentialResponse credential_response = 1;
}

message ProofTypeMetadata {
  repeated string proof_signing_alg_values_supported = 1;
  KeyAttestationsRequired key_attestations_required = 2;
}

// ProofTypeMetadataEntry replaces a protobuf map so the proof-type identifier
// remains visible to the closed-world scalar sensitivity policy.
message ProofTypeMetadataEntry {
  string proof_type = 1;
  ProofTypeMetadata metadata = 2;
}

message KeyAttestationsRequired {
  repeated string key_storage = 1;
  repeated string user_authentication = 2;
  uint64 preferred_key_storage_status_period = 3;
}

message CredentialSigningAlg {
  oneof value {
    string named = 1;
    int64 cose = 2;
  }
}

message CredentialConfiguration {
  CredentialFormat format = 1;
  string scope = 2;
  repeated string cryptographic_binding_methods_supported = 3;
  repeated CredentialSigningAlg credential_signing_alg_values_supported = 4;
  repeated ProofTypeMetadataEntry proof_types_supported = 5;
  bytes claims_json = 6;
  string vct = 7;
  string doctype = 8;
  bytes credential_metadata_json = 9;
}

message CredentialRequestEncryptionMetadata {
  repeated string alg_values_supported = 1;
  repeated string enc_values_supported = 2;
  repeated string zip_values_supported = 3;
  bytes jwks_json = 4;
  bool encryption_required = 5;
}

message CredentialResponseEncryptionMetadata {
  repeated string alg_values_supported = 1;
  repeated string enc_values_supported = 2;
  repeated string zip_values_supported = 3;
  bool encryption_required = 4;
}

message BatchCredentialIssuance {
  uint64 batch_size = 1;
}

// CredentialConfigurationEntry replaces a protobuf map so configuration IDs
// have explicit ownership and duplicate entries can fail closed in the codec.
message CredentialConfigurationEntry {
  string credential_configuration_id = 1;
  CredentialConfiguration configuration = 2;
}

message IssuerMetadata {
  string credential_issuer = 1;
  repeated string authorization_servers = 2;
  string credential_endpoint = 3;
  string nonce_endpoint = 4;
  string deferred_credential_endpoint = 5;
  string notification_endpoint = 6;
  CredentialRequestEncryptionMetadata credential_request_encryption = 7;
  CredentialResponseEncryptionMetadata credential_response_encryption = 8;
  repeated CredentialConfigurationEntry credential_configurations_supported = 9;
  uint64 preferred_client_status_period = 10;
  BatchCredentialIssuance batch_credential_issuance = 11;
}

// OpenId4VciOperationContractVersion versions the composed SDK/Wasm validation
// boundary independently from individual message evolution.
enum OpenId4VciOperationContractVersion {
  OPEN_ID4_VCI_OPERATION_CONTRACT_VERSION_UNSPECIFIED = 0;
  OPEN_ID4_VCI_OPERATION_CONTRACT_VERSION_V1 = 1;
}

// OpenId4VciOperationError is the deterministic failure outcome returned by the
// composed SDK/Wasm boundary. It never carries backend text or caller input.
message OpenId4VciOperationError {
  OpenId4VciErrorReason reason = 1;
}

// OpenId4VciOperationRequest validates and normalizes exactly one generated
// OpenID4VCI document. The request is protobuf-first so platform SDKs do not
// maintain a second DTO protocol.
message OpenId4VciOperationRequest {
  OpenId4VciOperationContractVersion contract_version = 1;
  oneof operation {
    CredentialOffer credential_offer = 2;
    IssuerMetadata issuer_metadata = 3;
    CredentialRequest credential_request = 4;
    CredentialResponse credential_response = 5;
    DeferredCredentialRequest deferred_credential_request = 6;
    NonceResponse nonce_response = 7;
    NotificationRequest notification_request = 8;
    ProblemDetails problem_details = 9;
  }
}

// OpenId4VciOperationResult contains exactly one validated canonical message.
// Keeping successful results nested lets the response outcome remain a stable
// result/error contract as operations are added in later schema revisions.
message OpenId4VciOperationResult {
  oneof result {
    CredentialOffer credential_offer = 1;
    IssuerMetadata issuer_metadata = 2;
    CredentialRequest credential_request = 3;
    CredentialResponse credential_response = 4;
    DeferredCredentialRequest deferred_credential_request = 5;
    NonceResponse nonce_response = 6;
    NotificationRequest notification_request = 7;
    ProblemDetails problem_details = 8;
  }
}

// OpenId4VciOperationResponse returns one generated result or one typed error.
// Callers must verify the contract version and the nested result oneof.
message OpenId4VciOperationResponse {
  oneof outcome {
    OpenId4VciOperationResult result = 1;
    OpenId4VciOperationError error = 2;
  }
  OpenId4VciOperationContractVersion contract_version = 3;
}
