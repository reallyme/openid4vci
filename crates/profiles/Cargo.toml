[package]
name = "openid4vci-profiles"
version = "0.1.1"
description = "OpenID4VCI profile constants and policy surfaces."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/openid4vci-profiles"
categories = ["authentication", "config"]
keywords = ["openid4vci", "haip", "eudi", "identity"]
publish = true
include = [
    "/src/**/*.rs",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
native = ["openid4vci-types/native", "reallyme-openid4vc-profiles/native"]
wasm = ["openid4vci-types/wasm", "reallyme-openid4vc-profiles/wasm"]

[dependencies]
openid4vci-types = { workspace = true }
reallyme-openid4vc-profiles = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
