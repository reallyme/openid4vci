[package]
name = "reallyme-openid4vci"
version = "0.1.1"
description = "ReallyMe OpenID4VCI protocol facade."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/README.md"]

[features]
default = [
    "native",
    "profiles",
    "codec",
    "http",
    "identity-jose",
]
native = [
    "openid4vci-attestation/native",
    "openid4vci-issuer/native",
    "openid4vci-proto-codec?/native",
    "openid4vci-types/native",
    "reallyme-openid4vci-wallet/native",
    "openid4vci-profiles?/native",
]
wasm = [
    "openid4vci-attestation/wasm",
    "openid4vci-issuer/wasm",
    "openid4vci-proto-codec?/wasm",
    "openid4vci-types/wasm",
    "reallyme-openid4vci-wallet/wasm",
    "openid4vci-profiles?/wasm",
]
profiles = ["dep:openid4vci-profiles"]
codec = [
    "dep:openid4vci-proto",
    "openid4vci-proto/generated",
    "dep:openid4vci-proto-codec",
    "dep:reallyme-ssi-proto",
    "reallyme-ssi-proto/generated",
]
http = [
    "dep:openid4vci-http",
    "openid4vci-http/axum",
]
tls = [
    "http",
    "openid4vci-http/tls",
]
reqwest = [
    "http",
    "openid4vci-http/reqwest",
]
identity-jose = [
    "openid4vci-issuer/identity-jose",
    "openid4vci-http?/identity-jose",
]

[dependencies]
openid4vci-attestation = { workspace = true }
openid4vci-http = { workspace = true, optional = true }
openid4vci-issuer = { workspace = true }
openid4vci-profiles = { workspace = true, optional = true }
openid4vci-proto = { workspace = true, optional = true }
openid4vci-proto-codec = { workspace = true, optional = true }
openid4vci-types = { workspace = true }
reallyme-openid4vci-wallet = { workspace = true }
reallyme-ssi-proto = { workspace = true, optional = true }

[lints]
workspace = true
