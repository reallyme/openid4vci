[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # The all-feature TLS lane includes rustls-webpki and AWS-LC components
    # distributed under these standard permissive licenses.
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
# Duplicate versions are denied except for the exact reviewed versions below.
# These exceptions reflect the published upstream dependency graphs.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Direct broad error/logging crates are prohibited by workspace lints and source
# review. Transitive dependencies retain their upstream error/logging choices
# and remain subject to source, license, and advisory checks.
deny = []
skip = [
    { name = "base64", version = "=0.22.1" },
    { name = "block-buffer", version = "=0.10.4" },
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "crypto-common", version = "=0.1.7" },
    { name = "digest", version = "=0.10.7" },
    { name = "generic-array", version = "=0.14.7" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "keccak", version = "=0.1.6" },
    # Arkworks' rand 0.8 still requires rand_core 0.6 while the current
    # crypto suites use newer major versions.
    { name = "rand_core", version = "=0.6.4" },
    { name = "sha3", version = "=0.10.9" },
    { name = "syn", version = "=2.0.119" },
    # X.509's asn1-rs derive graph still uses synstructure 0.13 while the
    # Unicode/ICU graph uses 0.14; neither is selected by this repository.
    { name = "synstructure", version = "=0.13.2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
