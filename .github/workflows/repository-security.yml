name: Repository security settings

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  private-vulnerability-reporting:
    name: Private vulnerability reporting remains enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify private vulnerability reporting
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/private-vulnerability-reporting" --jq '.enabled' | grep -qx true
