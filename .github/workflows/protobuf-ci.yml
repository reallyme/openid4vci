name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/protobuf-ci.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "crates/proto-codec/**"
      - "scripts/check_release_readiness.mjs"
      - "scripts/harden-generated-openid4vci-proto.mjs"
      - "scripts/proto-hardening/**"
      - "scripts/regenerate-openid4vci-proto.sh"
  push:
    branches:
      - main
      - trunk
    # Release preflight still requires successful exact-commit evidence. Manually
    # dispatch this workflow when a Markdown-only HEAD is a release candidate.
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.72.0

jobs:
  protobuf:
    name: lint and generated freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout openid4vci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vci
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: bdedc88f3f25fcc14242730d4dec6ce6a0c75531
          path: openid4vci/.release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openid4vci
          cache-bin: false

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      - name: Check canonical protobuf formatting
        working-directory: openid4vci
        run: buf format --diff --exit-code crates/proto/proto

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        working-directory: openid4vci
        run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=${{ github.event.repository.default_branch }}"

      - name: Check release readiness generated freshness
        working-directory: openid4vci
        run: node .release-readiness/scripts/run-consumer-check.mjs --generated-freshness
